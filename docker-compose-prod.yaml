# docker compose -f docker-compose-prod.yaml up -d
# docker compose -f docker-compose-prod.yaml down -v

services:
  catalog_db:
    container_name: catalog-db-prod
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=catalog-db
    restart: always
    ports:
      - "7411:5432"
    volumes:
      - postgres_catalog_prod:/var/lib/postgresql/
      
  catalog_api:
    container_name: catalog-api
    build:
      context: .
      dockerfile: ./dockerfile-catalog
      args: 
        - BUILDKIT_INLINE_CACHE=0
    ports:
      - "7301:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # - ConnectionStrings__PgConnection=...
      # - MediatR__LicenseKey=...
    depends_on:
      - catalog_db
    restart: unless-stopped
        
#basket
  basket_db:
    container_name: basket-db-prod
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=basket-db
    restart: always
    ports:
      - "7412:5432"
    volumes:
      - postgres_basket_prod:/var/lib/postgresql/

  basket_redis:
    container_name: basket-redis-prod
    image: redis
    command: redis-server --requirepass "12345678" --protected-mode no
    restart: always
    ports:
      - "7422:6379"
    volumes:
      - redis_basket_prod:/data

  basket_api:
    container_name: basket-api
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./dockerfile-basket
      args:
        - BUILDKIT_INLINE_CACHE=0
    ports:
      - "7302:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # - ConnectionStrings__PgConnection=...
      # - ConnectionStrings__RedisConnection=...
      # - GrpcServices__PromotionService=...
      # - MediatR__LicenseKey=...
    depends_on:
      - basket_db
      - basket_redis
      - promotion_api
    restart: unless-stopped
    
  promotion_db:
    container_name: promotion-db-prod
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=12345678
      - MYSQL_DATABASE=promotion-db
    restart: always
    ports:
      - "7403:3306"
    volumes:
      - mysql_promotion:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345678"]
      interval: 2s
      timeout: 2s
      retries: 10
  
  promotion_api:
    container_name: promotion-api
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./dockerfile-promotion
      args:
        - BUILDKIT_INLINE_CACHE=0
    ports:
      - "7303:8080"
      - "7313:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      promotion_db:
        condition: service_healthy
    restart: unless-stopped
               
volumes:
  postgres_catalog_prod:
  postgres_basket_prod:
  redis_basket_prod:
  mysql_promotion: