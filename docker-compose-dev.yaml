# docker compose -f docker-compose-dev.yaml down -v

services:
  catalog_db:
    container_name: catalog-db-dev
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=catalog-db
    restart: always
    ports:
      - "7101:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/
        
  basket_db:
    container_name: basket-db-dev
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=basket-db
    restart: always
    ports:
      - "7102:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql/
      
  basket_redis:
    container_name: basket-redis-dev
    image: redis
    command: redis-server --requirepass "12345678" --protected-mode no
    restart: always
    ports:
      - "7122:6379"
    volumes:
      - redis_basket:/data
      
  promotion_db:
    container_name: promotion-db-dev
    image: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=12345678
      - MYSQL_DATABASE=promotion-db
    restart: always
    ports:
      - "7103:3306"
    volumes:
      - mysql_promotion:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345678" ]
      interval: 2s
      timeout: 2s
      retries: 10
  
  rabbit_mq:
    container_name: rabbit-mq-dev
    image: rabbitmq:4.0-management
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5672:5672" #основной для взаимод-я с очередями. исп-ся клиентскими приложениями для подключения через amqp протокол. именно через него происходит публикация сообщений, подписка на очереди - все операции с сообшениями
      - "15672:15672" #web-интерфейс управления. админка. веб-морда. ui для мониторингв
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  
