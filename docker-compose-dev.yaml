#    environment:
#      - ASPNETCORE_ENVIRONMENT=Production
#    depends_on:
#      promotion_db:
#        condition: service_healthy
#    restart: unless-stopped
    
  checkout_db:
    container_name: checkout-db-dev
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=checkout-db
    restart: always
    ports:
      - "7104:5432"
    volumes:
      - postgres_checkout:/var/lib/postgresql/data/
      
volumes:
  postgres_catalog:
  postgres_basket:
  redis_basket:
  mysql_promotion:
  postgres_checkout:
  rabbitmq_data: